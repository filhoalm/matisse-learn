<script id="matisse-link-targets">
(() => {
  const updateLinks = () => {
    document.querySelectorAll('a[href]').forEach(link => {
      const href = link.getAttribute('href').trim();
      if (!href || /^(#|javascript:|mailto:|tel:)/i.test(href)) return;
      link.target = '_blank';
      const rel = new Set((link.getAttribute('rel') || '').split(/\s+/).filter(Boolean));
      rel.add('noopener');
      link.setAttribute('rel', [...rel].join(' '));
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateLinks, { once: true });
  } else {
    updateLinks();
  }
})();
</script>

<script id="matisse-footer-date">
(() => {
  const addDate = () => {
    const main = document.querySelector('main');
    if (main && !document.getElementById('course-last-updated')) {
      const footer = document.createElement('footer');
      footer.id = 'course-last-updated';
      footer.className = 'course-last-updated';
      footer.textContent = 'Last updated: 28 September 2026';
      main.appendChild(footer);
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addDate, { once: true });
  else addDate();
})();
</script>
